<main class="props-wrap"><a href="https://dongfeng19830925-stack.github.io/nexplay-art-progress/requirements.html">← 返回需求地图</a><h1>道具协作台</h1><p>添加道具文本、数量与图片；数据保存在Nexplay Pages，图片保存在指定OSS文件夹。公开协作入口，当前使用项目维护者授权的Nexplay临时AK保存。</p><p id="status" role="status" aria-live="polite">正在连接共享数据…</p><label for="target">对应场所 / 游戏</label><select id="target"></select><details><summary>甲方设备需求原文</summary><p id="original" class="pre"></p></details><div class="actions"><button id="refresh" type="button">刷新共享记录</button><span id="count"></span></div><section id="items" aria-label="共享道具清单"></section><p id="login-note" class="notice" hidden>当前为公开浏览。请在Nexplay登录有此Page编辑权限的账号后重新打开本页。<a href="/?next=%2Fp%2F5073efe36816492e83ea9381b0ddf4bd" target="_top">前往Nexplay登录</a></p><section id="editor" hidden><h2 id="form-title">添加道具</h2><form id="prop-form"><label for="editor-name">提交者</label><input id="editor-name" maxlength="80" placeholder="姓名或团队"><label for="prop-name">道具名称</label><input id="prop-name" maxlength="120" required><label for="prop-text">文字说明 / 尺寸 / 制作要求</label><textarea id="prop-text" maxlength="6000"></textarea><div class="cols"><div><label for="quantity">数量</label><input id="quantity" type="number" min="0.001" step="any" value="1" required></div><div><label for="unit">单位</label><input id="unit" value="件" maxlength="20" required></div></div><label>参考图片</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden><div id="drop" tabindex="0" role="button" aria-label="点击选择或拖入图片">拖拽图片到这里，或点击上传<br><small>JPEG / PNG / WebP / GIF · 每张最多30MB</small></div><div id="image-preview" class="previews"></div><p><small>上传成功后点击保存道具，将图片与文字数量关联。移除预览仅取消关联，不删除OSS原文件。</small></p><div class="actions"><button id="save" type="submit">保存到共享Pages</button><button id="cancel" type="button">取消编辑</button></div></form></section></main>
